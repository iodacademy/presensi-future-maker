# Pipeline Cloud Build: GitHub -> image -> Cloud Run
# Cloud Build pipeline: GitHub -> image -> Cloud Run
#
# Dipicu tiap push ke branch main. Substitusi _NEXT_PUBLIC_* diisi saat trigger
# dibuat; nilainya memang terkirim ke peramban sehingga bukan rahasia.
#
# Triggered on every push to main. The _NEXT_PUBLIC_* substitutions are set when
# the trigger is created; those values ship to the browser anyway, so they are
# not secrets.

# Region Singapura, bukan Jakarta: asia-southeast2 menolak pemetaan domain
# ("Creating domain mappings is not allowed in asia-southeast2"), sehingga
# innovators.iodacademy.id tidak dapat dipasang di sana. Firestore tetap di
# Jakarta -- query menyeberang region, tetapi pengukuran menunjukkan jalur ke
# Singapura justru lebih pendek dari Indonesia.
#
# Singapore rather than Jakarta: asia-southeast2 refuses domain mappings
# ("Creating domain mappings is not allowed in asia-southeast2"), so
# innovators.iodacademy.id cannot be attached there. Firestore stays in Jakarta
# -- queries cross regions, but measurements show the path to Singapore is
# actually shorter from Indonesia.
substitutions:
  _REGION: asia-southeast1
  _SERVICE: presensi-future-maker
  _REPO: containers
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: ''
  _NEXT_PUBLIC_FIREBASE_API_KEY: ''
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ''
  _NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ''
  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ''
  _NEXT_PUBLIC_FIREBASE_APP_ID: ''
  _NEXT_PUBLIC_APP_URL: ''

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      - --build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}
      - --build-arg=NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      # Dua tag: SHA untuk menelusuri revisi mana berasal dari commit mana,
      # latest untuk rujukan manusia.
      # Two tags: the SHA to trace which revision came from which commit, and
      # latest for human reference.
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      # Aplikasi punya login sendiri; IAM Cloud Run tidak boleh menghalangi
      # peserta membuka halaman masuk.
      # The app has its own login; Cloud Run IAM must not block participants
      # from reaching the sign-in page.
      - --allow-unauthenticated
      # Kredensial Firebase datang dari identitas service account ini lewat
      # metadata server -- tidak ada kunci yang perlu disimpan di mana pun.
      # Firebase credentials come from this service account's identity via the
      # metadata server -- no key needs storing anywhere.
      - --service-account=${_SERVICE}@${PROJECT_ID}.iam.gserviceaccount.com
      # FIREBASE_SERVICE_ACCOUNT_ID memberi tahu Firebase Admin atas nama akun
      # mana custom token ditandatangani. Tanpa ini Firebase menebak akun bawaan
      # App Engine dan seluruh login gagal dengan galat signBlob yang menunjuk
      # akun yang keliru.
      #
      # FIREBASE_SERVICE_ACCOUNT_ID tells Firebase Admin which account to sign
      # custom tokens as. Without it Firebase guesses the default App Engine
      # account and every login fails with a signBlob error naming the wrong one.
      - --set-env-vars=FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID},FIREBASE_SERVICE_ACCOUNT_ID=${_SERVICE}@${PROJECT_ID}.iam.gserviceaccount.com
      # Rahasia sungguhan diambil dari Secret Manager saat runtime, bukan
      # dibekukan ke dalam image.
      #
      # GOOGLE_CALENDAR_GAS_* menyambungkan booking mentoring ke Google
      # Calendar dan Meet lewat jembatan Apps Script (scripts/apps-script).
      # Kedua secret wajib sudah ada di Secret Manager sebelum push: --set-secrets
      # menggantikan seluruh daftar secret, dan secret yang tidak ada membuat
      # deploy gagal.
      #
      # Real secrets are read from Secret Manager at runtime, not baked into the
      # image.
      #
      # GOOGLE_CALENDAR_GAS_* connects mentoring bookings to Google Calendar and
      # Meet through the Apps Script bridge (scripts/apps-script). Both secrets
      # must exist in Secret Manager before pushing: --set-secrets replaces the
      # whole secret list, and a missing secret fails the deploy.
      - --set-secrets=QR_TOKEN_SECRET=qr-token-secret:latest,GOOGLE_CALENDAR_GAS_URL=google-calendar-gas-url:latest,GOOGLE_CALENDAR_GAS_SECRET=google-calendar-gas-secret:latest
      # Nol instance saat sepi. Instance yang menyala 24 jam menghabiskan
      # ~2,6 juta vCPU-detik sebulan, jauh melampaui kuota gratis 180.000,
      # sedangkan pemakaian bootcamp yang sesungguhnya masuk kuota itu dengan
      # lapang. Harganya: pengguna pertama setelah masa sepi menunggu sekitar
      # tiga detik (terukur 2,77 detik). Naikkan ke 1 pada hari sesi
      # berlangsung bila jeda itu mengganggu.
      #
      # Zero instances while idle. An always-on instance burns ~2.6M vCPU
      # seconds a month, far past the 180k free quota, while the bootcamp's
      # actual traffic fits inside it comfortably. The price: the first user
      # after an idle spell waits about three seconds (measured 2.77s). Raise
      # this to 1 on session days if that pause gets in the way.
      - --min-instances=0
      - --max-instances=10
      - --memory=1Gi
      - --cpu=1

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
